[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "hexrift"
description = "Rift Hex"
maintainers = [ { name = "wlix13", email = "github@wlix13.dev" } ]
authors = [ { name = "wlix13", email = "github@wlix13.dev" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "cryptography",
  "jinja2",
  "kyber-py",
  "orjson",
  "pydantic",
  "pyyaml",
  "rich",
  "rich-click",
]
scripts.hexrift = "hexrift.__main__:main"

[dependency-groups]
dev = [ "babel", "poethepoet", "prek", "ruff", "ty" ]
docs = [ "mkdocs-material[i18n]", "mkdocs-static-i18n" ]
tests = [ "pytest", "pytest-cov", "pytest-sugar" ]

[tool.hatch]
build.targets.wheel.packages = [ "hexrift" ]
build.artifacts = [ "hexrift/locales/**/*.mo" ]
metadata.allow-direct-references = true
version.path = "hexrift/__init__.py"

[tool.ruff]
line-length = 120
lint.select = [ "E", "F", "I", "N", "S", "UP", "W", "YTT" ]
lint.per-file-ignores."tests/*" = [
  "S101", # Use of `assert` detected
]
lint.isort.lines-after-imports = 2

[tool.ty]
environment.root = [ "." ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra -q --tb=short --cov=hexrift"
ini_options.markers = [
  "unit: pure unit tests, no I/O",
  "component: controller-level tests with tmp_path",
  "integration: full pipeline against real topology",
]

[tool.poe]
tasks.format = "uv run ruff format ."
tasks.check-format = "uv run ruff format --check ."
tasks.lint = "uv run ruff check ."
tasks.typecheck = "uv run --group dev --group tests ty check"
tasks.check = [ "check-format", "lint", "typecheck" ]
tasks.docs = "uv run --group docs mkdocs serve -f mkdocs.yaml"
tasks.tests = "uv run --group tests pytest"
tasks.i18n.help = "Full cycle: extract -> update -> compile"
tasks.i18n.sequence = [ "i18n-extract", "i18n-update", "i18n-fix-eol", "i18n-compile" ]
tasks.i18n-compile.help = "Compile .po files to binary .mo"
tasks.i18n-compile.cmd = "pybabel compile --domain hexrift --directory hexrift/locales --statistics"
tasks.i18n-extract.help = "Extract translatable strings to hexrift/locales/hexrift.pot"
tasks.i18n-extract.cmd = "pybabel extract --mapping babel.cfg --output hexrift/locales/hexrift.pot --project hexrift hexrift/"
tasks.i18n-fix-eol.help = "Normalise trailing newline in .po files (pybabel update adds a blank line)"
tasks.i18n-fix-eol.cmd = """\
  python -c \"import glob, pathlib; [p.write_text(p.read_text(encoding='utf-8').rstrip() + '\\n', encoding='utf-8') \
  for p in map(pathlib.Path, glob.glob('hexrift/locales/**/*.po', recursive=True))]\"\
  """
tasks.i18n-update.help = "Merge .pot into existing .po files"
tasks.i18n-update.cmd = "pybabel update --domain hexrift --input-file hexrift/locales/hexrift.pot --output-dir hexrift/locales --no-wrap"
