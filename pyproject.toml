[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "hexrift"
description = "Rift Hex"
readme = "README.md"
maintainers = [ { name = "wlix13", email = "github@wlix13.dev" } ]
authors = [ { name = "wlix13", email = "github@wlix13.dev" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "cryptography>=45",
  "jinja2",
  "kyber-py",
  "pydantic",
  "pyyaml",
  "rich",
  "rich-click",
]
scripts.hexrift = "hexrift.__main__:main"

[dependency-groups]
dev = [ "deptry", "import-linter", "poethepoet", "prek", "ruff", "ty" ]
docs = [ "zensical" ]
tests = [
  "hypothesis",
  "polyfactory",
  "pytest",
  "pytest-cov",
  "pytest-randomly",
  "pytest-sugar",
]

[tool.hatch]
version.path = "hexrift/__init__.py"
metadata.allow-direct-references = true
build.targets.wheel.packages = [ "hexrift" ]

[tool.ruff]
line-length = 120
lint.select = [ "E", "F", "I", "N", "S", "UP", "W", "YTT" ]
lint.per-file-ignores."tests/*" = [
  "S101", # Use of `assert` detected
]
lint.isort.lines-after-imports = 2

[tool.ty]
environment.root = [ "." ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra -q --tb=short --strict-markers"
ini_options.markers = [
  "component: controller-level tests with tmp_path",
  "integration: full pipeline against real topology",
  "unit: pure unit tests, no I/O",
]

[tool.importlinter]
root_package = "hexrift"

[[tool.importlinter.contracts]]
name = "feature spine (render -> inbounds -> links -> derive/keys -> schema)"
type = "layers"
layers = [
  "hexrift.components.render",
  "hexrift.inbounds",
  "hexrift.links",
  "hexrift.components.derive | hexrift.components.keys | hexrift.components.topology",
  "hexrift.components.schema",
]
ignore_imports = [
  # Registry dependency injection: every component's controller/component names HexRiftApp
  # under TYPE_CHECKING purely to type `self.app`
  "hexrift.components.*.controller -> hexrift.app",
  "hexrift.components.*.component -> hexrift.app",
  # derive's controller assembles user-facing share URLs from inbound spec builders
  # (single sanctioned edge from derive up into inbounds).
  "hexrift.components.derive.controller -> hexrift.inbounds.cdn",
  "hexrift.components.derive.controller -> hexrift.inbounds.hysteria",
  "hexrift.components.derive.controller -> hexrift.inbounds.xhttp",
]

[[tool.importlinter.contracts]]
name = "constants and errors are dependency-free"
type = "forbidden"
source_modules = [ "hexrift.constants", "hexrift.errors" ]
forbidden_modules = [
  "hexrift.app",
  "hexrift.components",
  "hexrift.core",
  "hexrift.inbounds",
  "hexrift.links",
  "hexrift.shared",
]

[[tool.importlinter.contracts]]
name = "schema models are pure data"
type = "forbidden"
source_modules = [ "hexrift.components.schema.models" ]
forbidden_modules = [
  "hexrift.app",
  "hexrift.components.schema.component",
  "hexrift.components.schema.controller",
  "hexrift.core",
  "hexrift.shared",
]

[[tool.importlinter.contracts]]
name = "core framework never imports feature code"
type = "forbidden"
source_modules = [ "hexrift.core" ]
forbidden_modules = [
  "hexrift.app",
  "hexrift.components",
  "hexrift.inbounds",
  "hexrift.links",
  "hexrift.shared",
]

[[tool.importlinter.contracts]]
name = "shared utilities stay below the feature layers"
type = "forbidden"
source_modules = [ "hexrift.shared" ]
forbidden_modules = [
  "hexrift.app",
  "hexrift.components.derive",
  "hexrift.components.keys",
  "hexrift.components.render",
  "hexrift.components.schema.component",
  "hexrift.components.schema.controller",
  "hexrift.core",
  "hexrift.inbounds",
  "hexrift.links",
]

[tool.poe]
tasks.format = "uv run ruff format ."
tasks.check-format = "uv run ruff format --check ."
tasks.lint = "uv run ruff check ."
tasks.typecheck = "uv run --group dev --group tests ty check"
tasks.lint-imports = "uv run --group dev lint-imports"
tasks.deptry = "uv run --group dev deptry ."
tasks.check = [ "check-format", "lint", "typecheck", "lint-imports", "deptry" ]
tasks.docs = "uv run --group docs zensical build --clean --strict"
tasks."docs:dev" = "uv run --group docs zensical serve"
tasks.tests = "uv run --group tests pytest"
tasks.coverage = "uv run --group tests pytest --cov=hexrift --cov-report=term --cov-report=html"
