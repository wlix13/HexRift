name: 🔄 Update JSON schema

on:
  push:
    branches:
      - main
    paths:
      - "hexrift/components/schema/models/**"
      - "hexrift/constants.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-schema
  cancel-in-progress: false

jobs:
  update-schema:
    name: 🏗️ Update schema.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --group dev

      - name: Generate schema.json
        run: |
          uv run python -c "
          import json
          from hexrift.components.schema.models.root import ConglomerateConfig
          print(json.dumps(ConglomerateConfig.model_json_schema(), indent=2))
          " > hexrift/components/schema/schema.json

      - name: Open PR with updated schema
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(schema): update schema.json"
          branch: chore/update-schema
          delete-branch: true
          sign-commits: true
          title: "chore(schema): update schema.json"
          body: "Automated schema update triggered by changes to schema models."
          labels: automated
          add-paths: hexrift/components/schema/schema.json
