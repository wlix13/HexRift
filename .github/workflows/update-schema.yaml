name: 🔄 Update JSON schema

on:
  push:
    branches:
      - main
    paths:
      - "hexrift/components/schema/models/**"
      - "hexrift/constants.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-schema
  cancel-in-progress: false

jobs:
  update-schema:
    name: 🏗️ Update schema.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --group dev

      - name: Generate schema.json
        run: |
          uv run python -c "
          import json
          from hexrift.components.schema.models.root import ConglomerateConfig
          print(json.dumps(ConglomerateConfig.model_json_schema(), indent=2))
          " > hexrift/components/schema/schema.json

      - name: Open PR with updated schema
        id: schema-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(schema): update schema.json"
          branch: chore/update-schema
          delete-branch: true
          sign-commits: true
          title: "chore(schema): update schema.json"
          body: "Automated schema update triggered by changes to schema models."
          labels: automated
          add-paths: hexrift/components/schema/schema.json

      - name: Rebase the PR branch onto main
        if: steps.schema-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr update-branch --rebase chore/update-schema
