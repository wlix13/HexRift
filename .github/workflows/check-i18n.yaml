name: 🌐 Check translations are up-to-date

on:
  pull_request:
    branches:
      - main
    paths:
      - "hexrift/**/*.py"
      - "hexrift/locales/**"
      - "babel.cfg"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  check:
    name: 🌐 i18n freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --group dev

      - name: Extract, update, and compile translations
        run: uv run poe i18n

      - name: Check .po files are up-to-date
        run: |
          if ! git diff -I 'POT-Creation-Date' --exit-code hexrift/locales/ ':!*.mo'; then
            echo "::error::Translation files are out of date. Run 'poe i18n' locally, update the .po files, and commit them."
            exit 1
          fi
