version: 1
labels:
  # --- by PR "Type of change" checklist ---
  - label: "feature"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Feature\b'
  - label: "bug"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Bug fix\b'
  - label: "enhancement"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Enhancement\b'
  - label: "refactor"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Refactor\b'
  - label: "breaking-change"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Breaking change\b'
  - label: "security"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Security\b'

  # --- by changed paths ---
  - label: "docs"
    files:
      - "^docs/"
      - '^zensical\.toml$'
      - '^README\.md$'
  - label: "ci-cd"
    files:
      - '^\.github/'
  - label: "tests"
    files:
      - "^tests/"
  - label: "dependencies"
    files:
      - '^uv\.lock$'
  - label: "templates"
    files:
      - "^hexrift/templates/"
  - label: "schema"
    files:
      - "^hexrift/components/schema/"
  - label: "derive"
    files:
      - "^hexrift/components/derive/"
  - label: "keys"
    files:
      - "^hexrift/components/keys/"
  - label: "render"
    files:
      - "^hexrift/components/render/"
  - label: "inbounds"
    files:
      - "^hexrift/inbounds/"
  - label: "shared"
    files:
      - "^hexrift/shared/"
  - label: "core"
    files:
      - "^hexrift/core/"
  - label: "cli"
    files:
      - '^hexrift/components/[^/]+/component\.py$'
      - '^hexrift/app\.py$'
      - '^hexrift/__main__\.py$'
